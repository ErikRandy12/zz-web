<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailers Gallery</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #121212);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #1e1e1e);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .card-content {
            padding: 8px;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meta {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #aaaaaa);
        }
    </style>
</head>
<body>
    <div class="container" id="gallery">Loading content...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Expand Mini App to full screen

        async function loadContent() {
            try {
                // Replace with your hosted API endpoint
                const response = await fetch('https://your-api-domain.com/api/posts');
                const posts = await response.json();
                
                const gallery = document.getElementById('gallery');
                gallery.innerHTML = '';

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${post.thumbnail || 'https://via.placeholder.com/150'}" alt="${post.title}">
                        <div class="card-content">
                            <div class="title">${post.title}</div>
                            <div class="meta">${post.duration} | ${post.models}</div>
                        </div>
                    `;
                    gallery.appendChild(card);
                });
            } catch (err) {
                document.getElementById('gallery').innerText = 'Failed to load videos.';
            }
        }

        loadContent();
    </script>
</body>
</html>
